# --- Core ---------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_MAIN_STACK_SIZE=2048

# --- PWM (TIM1 CH1/CH2/CH3 -> phase U/V/W gate-drive inputs) ---------------
CONFIG_PWM=y
CONFIG_PWM_STM32=y

# --- GPIO (phase enable pins + scope sync pins) ----------------------------
CONFIG_GPIO=y

# --- Timing -----------------------------------------------------------------
# The commutation loop sleeps down to ~1.5 ms per step. A 1 kHz tick would
# quantise that badly, so the tick rate is raised to keep k_usleep() honest
# at the fast end of the ramp.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# --- Logging --------------------------------------------------------------------
# Deferred mode keeps LOG_INF() out of the commutation timing path - the
# log strings are formatted on a separate thread rather than inline.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Console (routed to UART on this board) ---------------------------------------
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# --- No dynamic allocation in application code; keep heap minimal for libc use ------
CONFIG_HEAP_MEM_POOL_SIZE=1024
