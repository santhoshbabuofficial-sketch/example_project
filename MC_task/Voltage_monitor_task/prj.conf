# --- Core ---------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_MAIN_STACK_SIZE=2048

# --- GPIO (PC0 normal trigger / PC1 fault trigger) -------------------------
CONFIG_GPIO=y

# --- ADC (0-25V voltage sensor module on ADC2_IN17 / PA4) -------------------
CONFIG_ADC=y
CONFIG_ADC_STM32=y

# --- Floating point in log output ------------------------------------------
CONFIG_FPU=y

# --- Logging --------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Console (routed to UART on this board) ---------------------------------------
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# --- No dynamic allocation in application code; keep heap minimal for libc use ------
CONFIG_HEAP_MEM_POOL_SIZE=1024
