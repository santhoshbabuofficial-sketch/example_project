# --- Core ---------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_MAIN_STACK_SIZE=4096

# --- PWM (TIM1 CH1/CH2/CH3 -> phase U/V/W) -------------------------------
CONFIG_PWM=y
CONFIG_PWM_STM32=y

# --- GPIO (phase driver enables + hall sensor inputs) --------------------
CONFIG_GPIO=y

# --- Hall interrupts run on the system workqueue -------------------------
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- Logging --------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Console (routed to UART on this board) ---------------------------------------
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
