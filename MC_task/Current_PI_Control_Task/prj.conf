# --- Core ---------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_MAIN_STACK_SIZE=2048

# --- GPIO -----------------------------------------------------------------
CONFIG_GPIO=y

# --- PWM (coil driver gate-drive input) -------------------------------------
CONFIG_PWM=y
CONFIG_PWM_STM32=y

# --- ADC (coil current sensing) ----------------------------------------------
CONFIG_ADC=y
CONFIG_ADC_STM32=y

# --- Logging (telemetry: reference/measured/error/duty each cycle) -------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Console (routed to UART on this board) ---------------------------------------
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# --- No dynamic allocation in application code; keep heap minimal for libc use ------
CONFIG_HEAP_MEM_POOL_SIZE=1024
