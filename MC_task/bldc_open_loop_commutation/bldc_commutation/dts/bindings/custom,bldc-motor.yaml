# Binding for a three-phase BLDC inverter built from three EN/IN style
# half-bridge gate drivers (IR2104, L6234, DRV8313, ...).
#
# Each phase contributes one PWM channel (the driver IN pin) and one GPIO
# (the driver SD / enable pin). A further GPIO is used purely as an
# oscilloscope trigger marker.

description: Three-phase BLDC inverter, six-step open-loop commutation

compatible: "custom,bldc-motor"

include: base.yaml

properties:
  pwms:
    required: true
    description: PWM channels feeding the three driver IN pins.

  pwm-names:
    required: true
    description: Must be "phase-a", "phase-b", "phase-c" in that order.

  enable-gpios:
    type: phandle-array
    required: true
    description: |
      Shutdown / enable pin of each half-bridge driver, in phase A, B, C
      order. Declare the electrical polarity here (IR2104 SD is active low)
      so the application can work in logical levels only.

  sync-gpios:
    type: phandle-array
    required: true
    description: Scope trigger, pulsed once per electrical revolution.
