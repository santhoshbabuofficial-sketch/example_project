# --- Core -------------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_MAIN_STACK_SIZE=2048

# No exceptions, no RTTI, no heap - the commutation path must stay
# deterministic and every allocation in this application is static.
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_HEAP_MEM_POOL_SIZE=0

# --- Timing -----------------------------------------------------------------
# Commutation dwell times reach ~1.5 ms at cruise. A 100 us tick keeps the
# quantisation error on each step down to a few percent. Raise this to 20000
# if a faster final speed is needed.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# --- PWM: TIM1 CH1/CH2/CH3 (PC0 / PC1 / PC2) --------------------------------
CONFIG_PWM=y
CONFIG_PWM_STM32=y

# --- GPIO: half-bridge shutdown pins and the scope sync marker --------------
CONFIG_GPIO=y

# --- Logging ----------------------------------------------------------------
# Deferred mode so LOG_INF() from the commutation thread never blocks on the
# UART and stretches a commutation step.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Console ----------------------------------------------------------------
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# --- Diagnostics (optional, handy while tuning the ramp) --------------------
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
