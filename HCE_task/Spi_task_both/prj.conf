CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y


CONFIG_HEAP_MEM_POOL_SIZE=0

CONFIG_GPIO=y
CONFIG_SPI=y

# Console/logging still goes out over the board's default UART console
# (e.g. via minicom/ST-Link VCP); this is independent of the SPI1
# peripheral now used for the application protocol itself.
CONFIG_SERIAL=y

CONFIG_LOG=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

CONFIG_ASSERT=y
CONFIG_BOOT_BANNER=n
CONFIG_REBOOT=y
